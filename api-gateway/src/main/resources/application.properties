spring.application.name=api-gateway
server.port=8080

# Product Service
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products,/api/products/**

# Order Service
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ORDER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders,/api/orders/**

# User Service
spring.cloud.gateway.server.webflux.routes[2].id=user-service
spring.cloud.gateway.server.webflux.routes[2].uri=${USER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/users,/api/users/**,/api/auth/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# Swagger UI
springdoc.swagger-ui.urlsPrimaryName=1 - Product Service
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=1 - Product Service
springdoc.swagger-ui.urls[0].url=/docs/products

springdoc.swagger-ui.urls[1].name=2 - Order Service
springdoc.swagger-ui.urls[1].url=/docs/orders

springdoc.swagger-ui.urls[2].name=3 - User Service
springdoc.swagger-ui.urls[2].url=/docs/users

# OpenAPI - Product Service
spring.cloud.gateway.server.webflux.routes[3].id=product-service-docs
spring.cloud.gateway.server.webflux.routes[3].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/products
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

# OpenAPI - Order Service
spring.cloud.gateway.server.webflux.routes[4].id=order-service-docs
spring.cloud.gateway.server.webflux.routes[4].uri=${ORDER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/orders
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

# OpenAPI - User Service
spring.cloud.gateway.server.webflux.routes[5].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[5].uri=${USER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/users
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

# CORS - Angular frontend
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*