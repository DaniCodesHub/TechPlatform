services:

  kafka:
    image: apache/kafka:latest
    container_name: techplatform-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  mongodb:
    image: mongo:latest
    container_name: techplatform-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - mongodb_data:/data/db

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techplatform-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql

  product-service:
    build:
      context: ./product-service
    container_name: techplatform-product-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=product_db;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      - sqlserver

  order-service:
    build:
      context: ./order-service
    container_name: techplatform-order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=order_db;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      SPRING_DATA_MONGODB_URI: "${MONGODB_URI}"
    depends_on:
      - sqlserver
      - kafka
      - mongodb
      - product-service

  user-service:
    build:
      context: ./user-service
    container_name: techplatform-user-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=user_db;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: "sa"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - sqlserver

  api-gateway:
    build:
      context: ./api-gateway
    container_name: techplatform-api-gateway
    ports:
      - "8080:8080"
    environment:
      PRODUCT_SERVICE_URL: "http://product-service:8081"
      ORDER_SERVICE_URL: "http://order-service:8082"
      USER_SERVICE_URL: "http://user-service:8083"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - product-service
      - order-service
      - user-service

  frontend:
    build:
      context: ./frontend
    container_name: techplatform-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  kafka_data:
  mongodb_data:
  sqlserver_data: