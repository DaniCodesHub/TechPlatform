spring.application.name=order-service

spring.datasource.url=jdbc:sqlserver://localhost;instanceName=TECHPLATFORM;databaseName=order_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=order_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/techplatform_events}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.app.orderservice.event